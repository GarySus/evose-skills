name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@garysus'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:install
      - name: Match tag and package version
        run: node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Release tag must match package.json version');"
      - name: Build versioned downloads
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          git archive --format=zip --prefix=evose-skills/ --output="dist/evose-skills-${GITHUB_REF_NAME}.zip" HEAD
          cd dist
          sha256sum *.zip *.tgz > SHA256SUMS
      - name: Attach downloads to release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.tgz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub npm package
        run: npm publish dist/*.tgz --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
